<!doctype html>
<html>
  <head>
    <title>Rocket Blaster</title>
    <meta name="description" content="An open source shoot 'em up game in outer space." />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="stylesheet" href="main.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <script defer data-domain="rocketblaster.app" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="score">Score: 0</div>
    <div id="accuracy">Accuracy: 0%</div>
    <div id="hits">Hits: 0</div>
    <div id="lives" role="img" aria-label="3 lives"></div>
    <div id="combo" hidden>Combo ×1</div>
    <div id="highScore">Best: 0</div>
    <div id="timer">0:00</div>
    <button id="soundToggle" aria-label="Toggle sound">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-volume"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M15 8a5 5 0 0 1 0 8" />
        <path d="M17.7 5a9 9 0 0 1 0 14" />
        <path
          d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"
        />
      </svg>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-muted"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path
          d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"
        />
        <path d="M16 10l4 4m0 -4l-4 4" />
      </svg>
    </button>
    <div id="touchControls">
      <div id="directionalControl" class="touchButton">
        <div id="joystick" class="joystick"></div>
      </div>
      <div id="shootButton" class="touchButton">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M2 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v0a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
          <path d="M6 12l1 -5h5l3 5" />
          <path d="M21 9l-7.8 0" />
        </svg>
      </div>
    </div>
    <div id="gameOver">
      Game Over
      <div id="newBest" hidden>New Best!</div>
      <div id="finalStats"></div>
      <button id="restartButton" class="game-button">Play Again</button>
    </div>
    <div id="testDeck" hidden></div>
    <div id="paused" hidden>
      Paused
      <div class="hint">Press P or tap to resume</div>
    </div>
    <div id="startDialog">
      <div class="start-floor" aria-hidden="true"></div>
      <div class="start-kicker">&#9733; Player 1 &#9733;</div>
      <h1 class="logo">
        <span class="logo-rocket">Rocket</span>
        <span class="logo-blaster">Blaster</span>
      </h1>
      <div class="subtitle"><span>Destroy asteroids</span> &middot; <span>Avoid black holes</span></div>
      <div class="hangar">
        <canvas class="hangar-rocket" id="hangarPreview" aria-hidden="true"></canvas>
        <div class="hangar-controls">
          <div class="hangar-label">Ship <span id="hullName" class="hull-name">Classic</span></div>
          <div class="hull-selector" id="hullSelector" role="radiogroup" aria-label="Ship"></div>
          <div class="hangar-label">Paint</div>
          <div class="color-selector" role="radiogroup" aria-label="Rocket color">
            <label class="color-option" style="--c: #ff4d4d">
              <input type="radio" name="rocketColor" value="red" aria-label="Red" />
              <span class="color-circle"></span>
            </label>
            <label class="color-option" style="--c: #ffbf00">
              <input type="radio" name="rocketColor" value="amber" aria-label="Amber" />
              <span class="color-circle"></span>
            </label>
            <label class="color-option" style="--c: #00cc00">
              <input type="radio" name="rocketColor" value="green" aria-label="Green" />
              <span class="color-circle"></span>
            </label>
            <label class="color-option" style="--c: #02b7ff">
              <input type="radio" name="rocketColor" value="blue" checked aria-label="Blue" />
              <span class="color-circle"></span>
            </label>
            <label class="color-option" style="--c: #9900cc">
              <input type="radio" name="rocketColor" value="purple" aria-label="Purple" />
              <span class="color-circle"></span>
            </label>
            <label class="color-option" style="--c: #ff66b2">
              <input type="radio" name="rocketColor" value="pink" aria-label="Pink" />
              <span class="color-circle"></span>
            </label>
            <label class="color-option" style="--c: #686868">
              <input type="radio" name="rocketColor" value="gray" aria-label="Gray" />
              <span class="color-circle"></span>
            </label>
          </div>
          <label class="gravity-label"><input type="checkbox" id="zeroGravityToggle" /> Zero G</label>
        </div>
      </div>
      <button id="startButton" class="game-button">Blast off</button>
      <div class="instructions">
        <span class="key-hint">
          <span><kbd>WASD</kbd> or <kbd>&larr;&uarr;&darr;&rarr;</kbd> fly</span>
          <span><kbd>Space</kbd> shoot</span>
          <span><kbd>P</kbd> pause</span>
        </span>
        <span class="touch-hint">Left stick to fly &middot; Right button to shoot</span>
      </div>
      <div class="author">
        by <a href="https://x.com/claviska" target="_blank">Cory LaViska</a> &middot;
        <a href="https://github.com/claviska/rocket-blaster/" target="_blank">open source</a>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="main.js"></script>
  </body>
</html>
